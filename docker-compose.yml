services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_example
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_example"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
  api:
    build:
      context: ./api
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://app:app@postgres:5432/app_example
      JWT_SECRET: local-compose-secret-not-for-production
      JWT_EXPIRES_IN: 15m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "8080:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
