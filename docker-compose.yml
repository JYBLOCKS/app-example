services:
  api:
    build:
      context: ./api
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
